<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Arbeitsauftrag Höhenwerte und Sinusgraph</title>
  <desc id="desc">Leere Tabelle für Winkel und Höhenwerte sowie ein Koordinatensystem von 0 bis 360 Grad.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #172033; }
      .muted { fill: #536173; }
      .accent { fill: #2457c5; }
      .soft { fill: #eef4ff; }
      .line { stroke: #172033; stroke-width: 2; }
      .thin { stroke: #6f7c8f; stroke-width: 1; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .grid-strong { stroke: #94a3b8; stroke-width: 1.5; }
      .axis { stroke: #172033; stroke-width: 2.4; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #172033; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #172033; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #172033; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #172033; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect x="34" y="32" width="1332" height="836" rx="28" fill="#f8fafc" stroke="#d8e0ea" stroke-width="2"/>

  <g transform="translate(64 58)">
