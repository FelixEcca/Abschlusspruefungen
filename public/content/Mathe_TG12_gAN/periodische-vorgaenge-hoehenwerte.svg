  <g transform="translate(1030 360)">
    <rect x="0" y="0" width="306" height="210" rx="18" fill="#fff" stroke="#d8e0ea" stroke-width="2"/>
    <circle cx="28" cy="30" r="14" fill="#2457c5"/>
    <text x="28" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff">c</text>
    <text x="55" y="38" class="note bold">Eigenschaften</text>
    <text x="28" y="78" class="note">Beschreiben Sie in eigenen</text>
    <text x="28" y="108" class="note">Worten, welche Eigenschaften</text>
    <text x="28" y="138" class="note">des Graphen Ihnen auffallen.</text>
  </g>

  <g transform="translate(1030 600)">
    <rect x="0" y="0" width="306" height="225" rx="18" fill="#fff" stroke="#d8e0ea" stroke-width="2"/>
    <circle cx="28" cy="30" r="14" fill="#2457c5"/>
    <text x="28" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff">d</text>
    <text x="55" y="38" class="note bold">Zusammenhang</text>
    <text x="28" y="78" class="note">Betrachten Sie nochmals den</text>
    <text x="28" y="108" class="note">Kreis. Überlegen Sie, wie sich</text>
    <text x="28" y="138" class="note">die Höhe der Zeigerspitze</text>
    <text x="28" y="168" class="note">berechnen lässt.</text>
