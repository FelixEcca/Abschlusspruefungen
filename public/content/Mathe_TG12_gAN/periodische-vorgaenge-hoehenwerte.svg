        <text x="-18" y="202">0°</text>
        <text x="68.33" y="222">30°</text><text x="136.67" y="222">60°</text><text x="205" y="222">90°</text>
        <text x="273.33" y="222">120°</text><text x="341.67" y="222">150°</text><text x="410" y="222">180°</text>
