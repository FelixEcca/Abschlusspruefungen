    <text x="42" y="22" class="label bold">Höhenwerte eintragen und den Graphen zeichnen</text>
    <text x="42" y="56" class="small" fill="#536173">Tragen Sie die gemessenen Höhenwerte ein. Zeichnen Sie anschließend den zugehörigen Graphen.</text>
  </g>

