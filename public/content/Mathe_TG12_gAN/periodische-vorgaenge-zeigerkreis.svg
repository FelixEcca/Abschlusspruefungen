<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Arbeitsauftrag Zeigerkreis</title>
  <desc id="desc">Stilisierter Zeiger im Kreis und ein leeres Koordinatensystem mit Kreis zum Einzeichnen von Winkeln.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #d8e0ea; stroke-width: 2; }
      .ink { fill: #172033; }
      .muted { fill: #536173; }
      .accent { fill: #2457c5; }
      .water { fill: #d9ecff; }
      .water-dark { stroke: #4d8fc4; stroke-width: 2; fill: none; opacity: .75; }
      .line { stroke: #172033; stroke-width: 3; fill: none; }
      .thin { stroke: #6f7c8f; stroke-width: 1.2; fill: none; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .grid-strong { stroke: #94a3b8; stroke-width: 1.4; }
      .axis { stroke: #172033; stroke-width: 2.6; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill: #172033; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #172033; }
      .bold { font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#172033"/>
    </marker>
    <clipPath id="tankClip">
      <circle cx="300" cy="300" r="235"/>
    </clipPath>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <rect x="34" y="32" width="1332" height="696" rx="28" fill="#f8fafc" stroke="#d8e0ea" stroke-width="2"/>

  <g transform="translate(64 58)">
    <circle cx="14" cy="14" r="14" fill="#2457c5"/>
    <text x="14" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff">a</text>
    <text x="42" y="22" class="label bold">Zeiger einzeichnen und Höhen messen</text>
    <text x="42" y="56" class="small" fill="#536173">Zeichnen Sie für jeden Winkel 0°, 10°, 20°, 30°, ..., 360° den Zeiger ein und messen Sie die Höhe der Zeigerspitze über der Wasseroberfläche.</text>
  </g>

